<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Produit — PhoneStore</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="header">
    <div class="container header-inner">
      <a href="index.html" class="logo">
        <div class="logo-icon">📱</div>
        PhoneStore
      </a>
      <nav class="nav">
        <a href="index.html">Accueil</a>
        <a href="catalogue.html">Catalogue</a>
        <a href="catalogue.html?category=premium">Premium</a>
        <a href="catalogue.html?category=budget">Budget</a>
      </nav>
      <div class="header-actions">
        <a href="panier.html" class="cart-btn">
          🛒 Panier
          <span class="cart-badge">0</span>
        </a>
        <button class="menu-toggle" aria-label="Menu">☰</button>
      </div>
    </div>
  </header>

  <div class="container">
    <div class="breadcrumb" id="breadcrumb">
      <a href="index.html">Accueil</a>
      <span>/</span>
      <a href="catalogue.html">Catalogue</a>
      <span>/</span>
      <span id="breadcrumb-name">Produit</span>
    </div>
  </div>

  <section class="section" style="padding-top:0">
    <div class="container" id="product-container">
      <!-- Rendu dynamique -->
    </div>
  </section>

  <section class="section" style="padding-top:0">
    <div class="container">
      <div class="section-header">
        <h2>Vous aimerez aussi</h2>
      </div>
      <div class="products-grid" id="related-products"></div>
    </div>
  </section>

  <footer class="footer">
    <div class="container">
      <div class="footer-bottom">
        © 2026 PhoneStore — Tous droits réservés
      </div>
    </div>
  </footer>

  <script src="js/products.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/app.js"></script>
  <script>
    let quantity = 1;

    function renderProduct(product) {
      document.title = `${product.name} — PhoneStore`;
      document.getElementById('breadcrumb-name').textContent = product.name;

      const oldPriceHtml = product.oldPrice
        ? `<span class="detail-old-price">${formatPrice(product.oldPrice)}</span>`
        : '';

      const specsRows = Object.entries(product.specs)
        .map(([key, val]) => `<tr><td>${key.charAt(0).toUpperCase() + key.slice(1)}</td><td>${val}</td></tr>`)
        .join('');

      document.getElementById('product-container').innerHTML = `
        <div class="product-detail">
          <div class="detail-image">
            <img src="${product.image}" alt="${product.name}">
          </div>
          <div class="detail-info">
            <div class="detail-brand">${product.brand}</div>
            <h1>${product.name}</h1>
            <div class="detail-rating">${renderStars(product.rating)} (${product.reviews} avis)</div>
            <div>
              <span class="detail-price">${formatPrice(product.price)}</span>
              ${oldPriceHtml}
            </div>
            <p class="detail-description">${product.description}</p>
            <div class="detail-options">
              <div class="detail-option">
                <label>Stockage</label>
                <span>${product.storage}</span>
              </div>
              <div class="detail-option">
                <label>Couleur</label>
                <span>${product.color}</span>
              </div>
            </div>
            <div class="detail-option">
              <label>Quantité</label>
              <div class="quantity-selector">
                <button id="qty-minus">−</button>
                <span id="qty-value">1</span>
                <button id="qty-plus">+</button>
              </div>
            </div>
            <div class="detail-actions">
              <button class="btn btn-accent" id="add-to-cart" ${product.inStock ? '' : 'disabled'} style="padding:16px 32px;font-size:1.05rem">
                ${product.inStock ? '🛒 Ajouter au panier' : 'Rupture de stock'}
              </button>
              <a href="catalogue.html" class="btn btn-outline" style="border:1px solid var(--border);color:var(--text);padding:16px 32px">← Retour au catalogue</a>
            </div>
          </div>
        </div>
        <div class="specs-table">
          <h3>Caractéristiques techniques</h3>
          <table>${specsRows}</table>
        </div>
      `;

      document.getElementById('qty-minus').addEventListener('click', () => {
        if (quantity > 1) {
          quantity--;
          document.getElementById('qty-value').textContent = quantity;
        }
      });

      document.getElementById('qty-plus').addEventListener('click', () => {
        quantity++;
        document.getElementById('qty-value').textContent = quantity;
      });

      document.getElementById('add-to-cart').addEventListener('click', () => {
        if (addToCart(product.id, quantity)) {
          showToast(`${quantity} × ${product.name} ajouté au panier !`);
        }
      });

      const related = PRODUCTS.filter(p => p.id !== product.id && p.category === product.category).slice(0, 4);
      const relatedGrid = document.getElementById('related-products');
      relatedGrid.innerHTML = '';
      related.forEach(p => relatedGrid.appendChild(createProductCard(p)));
    }

    document.addEventListener('DOMContentLoaded', () => {
      const id = getUrlParam('id');
      const product = getProductById(id);

      if (!product) {
        document.getElementById('product-container').innerHTML = `
          <div class="empty-cart">
            <div class="empty-cart-icon">😕</div>
            <h2>Produit introuvable</h2>
            <p>Ce produit n'existe pas ou a été retiré.</p>
            <a href="catalogue.html" class="btn btn-accent">Retour au catalogue</a>
          </div>
        `;
        return;
      }

      renderProduct(product);
    });
  </script>
</body>
</html>
