<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panier — PhoneStore</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="header">
    <div class="container header-inner">
      <a href="index.html" class="logo">
        <div class="logo-icon">📱</div>
        PhoneStore
      </a>
      <nav class="nav">
        <a href="index.html">Accueil</a>
        <a href="catalogue.html">Catalogue</a>
        <a href="catalogue.html?category=premium">Premium</a>
        <a href="catalogue.html?category=budget">Budget</a>
      </nav>
      <div class="header-actions">
        <a href="panier.html" class="cart-btn">
          🛒 Panier
          <span class="cart-badge">0</span>
        </a>
        <button class="menu-toggle" aria-label="Menu">☰</button>
      </div>
    </div>
  </header>

  <div class="container">
    <div class="breadcrumb">
      <a href="index.html">Accueil</a>
      <span>/</span>
      Panier
    </div>
  </div>

  <section class="section" style="padding-top:0">
    <div class="container">
      <h1 style="font-size:2rem;margin-bottom:32px">Mon panier</h1>
      <div id="cart-content"></div>
    </div>
  </section>

  <footer class="footer">
    <div class="container">
      <div class="footer-bottom">
        © 2026 PhoneStore — Tous droits réservés
      </div>
    </div>
  </footer>

  <script src="js/products.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/app.js"></script>
  <script>
    function renderCart() {
      const cart = getCart();
      const container = document.getElementById('cart-content');

      if (cart.length === 0) {
        container.innerHTML = `
          <div class="empty-cart">
            <div class="empty-cart-icon">🛒</div>
            <h2>Votre panier est vide</h2>
            <p>Découvrez notre catalogue et trouvez le smartphone idéal.</p>
            <a href="catalogue.html" class="btn btn-accent">Parcourir le catalogue</a>
          </div>
        `;
        return;
      }

      const subtotal = getCartTotal();
      const shipping = subtotal >= 50 ? 0 : 4.99;
      const total = subtotal + shipping;

      let itemsHtml = '';
      cart.forEach(item => {
        const product = getProductById(item.id);
        if (!product) return;

        itemsHtml += `
          <div class="cart-item" data-id="${item.id}">
            <div class="cart-item-image">
              <img src="${product.image}" alt="${product.name}">
            </div>
            <div class="cart-item-info">
              <div class="cart-item-brand">${product.brand}</div>
              <div class="cart-item-name">${product.name}</div>
              <div style="color:var(--text-muted);font-size:.85rem">${product.storage} — ${product.color}</div>
              <div class="cart-item-price">${formatPrice(product.price * item.quantity)}</div>
            </div>
            <div class="cart-item-actions">
              <div class="quantity-selector">
                <button class="cart-qty-minus" data-id="${item.id}">−</button>
                <span>${item.quantity}</span>
                <button class="cart-qty-plus" data-id="${item.id}">+</button>
              </div>
              <button class="remove-btn" data-id="${item.id}">Supprimer</button>
            </div>
          </div>
        `;
      });

      container.innerHTML = `
        <div class="cart-layout">
          <div class="cart-items">${itemsHtml}</div>
          <div class="cart-summary">
            <h3>Récapitulatif</h3>
            <div class="summary-row">
              <span>Sous-total</span>
              <span>${formatPrice(subtotal)}</span>
            </div>
            <div class="summary-row">
              <span>Livraison</span>
              <span>${shipping === 0 ? 'Gratuite' : formatPrice(shipping)}</span>
            </div>
            ${subtotal < 50 ? `<p style="font-size:.85rem;color:var(--text-muted);margin-top:8px">Plus que ${formatPrice(50 - subtotal)} pour la livraison gratuite !</p>` : ''}
            <div class="summary-row total">
              <span>Total</span>
              <span>${formatPrice(total)}</span>
            </div>
            <button class="btn btn-accent" id="checkout-btn">Commander</button>
            <a href="catalogue.html" class="btn btn-outline" style="border:1px solid var(--border);color:var(--text);margin-top:12px">Continuer mes achats</a>
          </div>
        </div>
      `;

      container.querySelectorAll('.cart-qty-minus').forEach(btn => {
        btn.addEventListener('click', () => {
          const id = parseInt(btn.dataset.id);
          const item = getCart().find(i => i.id === id);
          updateQuantity(id, item.quantity - 1);
          renderCart();
        });
      });

      container.querySelectorAll('.cart-qty-plus').forEach(btn => {
        btn.addEventListener('click', () => {
          const id = parseInt(btn.dataset.id);
          const item = getCart().find(i => i.id === id);
          updateQuantity(id, item.quantity + 1);
          renderCart();
        });
      });

      container.querySelectorAll('.remove-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          removeFromCart(parseInt(btn.dataset.id));
          renderCart();
          showToast('Produit retiré du panier');
        });
      });

      document.getElementById('checkout-btn').addEventListener('click', () => {
        showToast('Merci ! Votre commande a été enregistrée (démo).', 'success');
        clearCart();
        setTimeout(() => renderCart(), 2000);
      });
    }

    document.addEventListener('DOMContentLoaded', renderCart);
  </script>
</body>
</html>
